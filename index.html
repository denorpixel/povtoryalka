<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Повторялка</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <script>
    window.onerror = function(msg, url, line) {
      var d = document.getElementById('sys-debug');
      if (d) {
        var fileName = url ? url.substring(url.lastIndexOf('/')+1) : 'неизвестный файл/inline';
        d.style.display = 'block';
        d.innerHTML += '<p>❌ Ошибка в <b>' + fileName + '</b>: ' + msg + ' (стр. ' + line + ')</p>';
      }
    };
    function scriptErr(name) {
      var d = document.getElementById('sys-debug');
      if (d) { d.style.display = 'block'; d.innerHTML += '<p>⚠️ Файл не загружен сервером: ' + name + '</p>'; }
    }
  </script>
  <link rel="stylesheet" href="chessboard-1.0.0.min.css?v=7" onerror="scriptErr('CSS доски')">
  <script src="pgn-parser.js?v=7" onerror="scriptErr('pgn-parser.js')"></script>
  <style>
    #sys-debug { display: none; background: #c0392b; color: white; padding: 15px; font-family: monospace; z-index: 10000; position: fixed; top: 0; left: 0; right: 0; font-size: 14px; max-height: 40vh; overflow-y: auto;}
    body { margin: 0; display: flex; height: 100vh; background-color: #1e1e1e; color: #d4d4d4; font-family: sans-serif; overflow: hidden; }
    
    #sidebar { width: 300px; background-color: #252526; border-right: 1px solid #333; display: flex; flex-direction: column; flex-shrink: 0; }
    #sidebar-header { padding: 12px; background: #2d2d30; border-bottom: 1px solid #333; flex-shrink: 0; }
    
    .header-top { display: block; overflow: hidden; margin-bottom: 5px; }
    .header-title { float: left; font-size: 1.1em; font-weight: bold; color: #fff; margin-top: 6px; }
    .btn-toggle-pgn { float: right; background: #4ec9b0; color: #1e1e1e; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.9em; margin: 0; }
    #add-pgn-options { display: none; gap: 8px; margin-top: 10px; clear: both; }
    
    .file-upload-btn-w { display: block; cursor: pointer; background: #e0e0e0; color: #1e1e1e; padding: 10px; border-radius: 4px; font-size: 0.95em; flex: 1; text-align: center; font-weight: bold; }
    .file-upload-btn-b { display: block; cursor: pointer; background: #333; color: #fff; padding: 10px; border-radius: 4px; font-size: 0.95em; flex: 1; text-align: center; border: 1px solid #666; font-weight: bold; }
    
    #file-tree { padding: 10px; overflow-y: auto; flex: 1; }
    .folder-header { background: #333337; padding: 10px; cursor: pointer; font-weight: bold; font-size: 1.05em; border-radius: 4px; border: 1px solid #444; display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .folder-header:active { background: #3f3f46; }
    .folder-content { padding-left: 10px; margin-bottom: 10px; }
    
    .tree-item { padding: 10px; margin: 4px 0; cursor: pointer; border-radius: 4px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #333; }
    .tree-item:active { background-color: #37373d; }
    .item-name { display: flex; align-items: center; gap: 8px; font-size: 1.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
    .item-status { font-size: 0.85em; color: #888; }
    .file.active { background-color: #04395e; color: #fff; }
    .btn-delete { background: #ff6b6b; color: white; border: none; border-radius: 3px; padding: 4px 8px; cursor: pointer; font-size: 0.8em; margin-left: 5px; }
    
    #main { flex: 1; display: flex; padding: 10px; gap: 20px; align-items: flex-start; justify-content: center; overflow-y: auto; }
    
    /* Запрет прокрутки экрана от касаний по доске на уровне стилей */
    #board-container { width: 100%; max-width: 500px; flex-shrink: 0; margin-bottom: 15px; touch-action: none; }
    #board { touch-action: none; }
    
    #right-panel { flex: 1; max-width: 350px; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; }
    
    /* Обновленный текст статуса: перенос строк, гибкая высота */
    #status-text { font-size: 1.15em; font-weight: bold; color: #4ec9b0; text-align: center; min-height: 48px; display: flex; align-items: center; justify-content: center; white-space: pre-wrap; word-wrap: break-word; line-height: 1.3; }
    
    #move-comment { display: none; background-color: #2b3a42; padding: 10px; border-left: 5px solid #4ec9b0; border-radius: 4px; font-size: 1.1em; max-height: 150px; overflow-y: auto; }
    
    #controls { display: flex; flex-direction: column; gap: 8px; }
    .btn-row { display: flex; gap: 8px; }
    button { flex: 1; padding: 12px; background-color: #0e639c; color: white; border: none; border-radius: 5px; font-size: 1.1em; font-weight: bold; cursor: pointer; }
    button:disabled { background-color: #333; color: #666; cursor: default; }
    #btn-hint { background-color: #cca700; color: #1e1e1e; }
    
    #stats-box { background: #2d2d30; padding: 10px; border-radius: 5px; border: 1px solid #444; display: flex; justify-content: space-around; font-size: 1.1em; }
    .stat-line { margin: 0; }
    .stat-val-err { color: #ff6b6b; font-weight: bold; margin-left: 5px; }
    .stat-val-hint { color: #cca700; font-weight: bold; margin-left: 5px; }
    
    #moves-history { flex: 1; background: #252526; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 1.1em; max-height: 200px; overflow-y: auto; }
    
    #end-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 100; }
    .modal-content { background: #252526; padding: 30px; border-radius: 10px; text-align: center; border: 1px solid #555; width: 90%; max-width: 400px; }
    #modal-title { color: #4ec9b0; font-size: 1.5em; margin-top: 0; }
    .modal-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 20px;}
    #btn-retry-yes { background-color: #28a745; }
    #btn-retry-no { background-color: #dc3545; }

    .white-1e1d7 { background-color: #dce3eb !important; color: #6982a6 !important; }
    .black-3c85d { background-color: #6982a6 !important; color: #dce3eb !important; }

    @media (max-width: 768px) {
      body { display: block; height: auto; overflow: auto; background-color: #1e1e1e; }
      #sidebar { display: block; width: 100%; max-height: 30vh; border-right: none; border-bottom: 2px solid #000; overflow-y: auto; }
      #main { display: block; width: 100%; padding: 15px 10px; box-sizing: border-box; }
      #board-container { display: block; width: 100%; max-width: 95vw; margin: 0 auto 20px auto; }
      #right-panel { display: flex; flex-direction: column; max-width: 100%; width: 100%; gap: 12px; margin: 0 auto; }
      #status-text { order: 1; }
      #stats-box { order: 2; padding: 12px; }
      #controls { order: 3; }
      #move-comment { order: 4; }
      #moves-history { order: 5; }
    }
  </style>
</head>
<body>
  <div id="sys-debug"></div>
  <div id="sidebar">
    <div id="sidebar-header">
       <div class="header-top">
           <div class="header-title">Дебюты</div>
           <button class="btn-toggle-pgn" onclick="var el = document.getElementById('add-pgn-options'); el.style.display = (el.style.display === 'flex') ? 'none' : 'flex';">
               + Добавить PGN
           </button>
       </div>
       <div id="add-pgn-options">
           <label class="file-upload-btn-w">
               В белые
               <input type="file" id="pgn-upload-w" accept=".pgn" multiple style="display: none;">
           </label>
           <label class="file-upload-btn-b">
               В черные
               <input type="file" id="pgn-upload-b" accept=".pgn" multiple style="display: none;">
           </label>
       </div>
    </div>
    <div id="file-tree"></div>
  </div>
  
  <div id="main">
    <div id="board-container">
      <div id="board"></div>
      <div id="end-modal">
        <div class="modal-content">
          <h3 id="modal-title">Линия пройдена!</h3>
          <div id="modal-stats"></div>
          <div class="modal-buttons">
            <button id="btn-retry-yes">Дальше</button>
            <button id="btn-retry-no" style="display: none;">Закрыть</button>
          </div>
        </div>
      </div>
    </div>
    
    <div id="right-panel">
        <div id="status-text">Выберите файл</div>
        <div id="move-comment"></div> 
        <div id="stats-box">
            <div class="stat-line"><span>Ошибки:</span> <span id="val-err" class="stat-val-err">0</span></div>
            <div class="stat-line"><span>Подсказки:</span> <span id="val-hint" class="stat-val-hint">0</span></div>
        </div>
        <div id="controls">
            <div class="btn-row">
                <button id="btn-start" disabled>Заново</button>
                <button id="btn-hint" disabled>💡 Подсказка</button>
            </div>
        </div>
        <div id="moves-history"></div>
    </div>
  </div>
  
  <script src="jquery-3.6.0.min.js?v=7" onerror="scriptErr('jquery')"></script>
  <script src="chessboard-1.0.0.min.js?v=7" onerror="scriptErr('chessboard')"></script>
  <script src="chess.min.js?v=7" onerror="scriptErr('chess.js')"></script>
  <script src="app.js?v=7" onerror="scriptErr('app.js')"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function(err) {
         var d = document.getElementById('sys-debug');
         if (d) { d.style.display = 'block'; d.innerHTML += '<p>⚠️ Офлайн-кэш не запущен: ' + err.message + '</p>'; }
      });
    }
  </script>
</body>
</html>
